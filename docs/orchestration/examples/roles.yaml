# `kind:` declares what a role is; it drives the read-only review bundle and
# prompt controls in run mode. Omitting it falls back to inference from the role
# id and capabilities, which misfires in both directions. Valid values:
# implementer, reviewer, independent_reviewer, adversarial_reviewer, architect,
# qa. An explicitly empty `kind: []` means "none of these kinds".
roles:
  architect:
    kind:
      - architect
    requiredCapabilities:
      - architecture
    requiredTools:
      - filesystem
    preferredTiers:
      - frontier

  seniorImplementer:
    kind:
      - implementer
    requiredCapabilities:
      - repo_edit
      - coding
    requiredTools:
      - git
      - filesystem
    preferredTiers:
      - frontier

  independentReviewer:
    kind:
      - independent_reviewer
    requiredCapabilities:
      - code_review
    requiredTools:
      - filesystem
    familyConstraint: opposite_of_implementer
    preferredCostClasses:
      - low
      - medium

  qaGate:
    kind:
      - qa
    requiredCapabilities:
      - validation
    requiredTools:
      - shell
    preferredCostClasses:
      - near_zero
      - low

  adversarialReviewer:
    kind:
      - adversarial_reviewer
    requiredCapabilities:
      - adversarial_review
      - bug_hunt
    requiredTools:
      - filesystem
    preferredCostClasses:
      - low
      - medium

  localTriage:
    kind: []
    requiredCapabilities:
      - triage
    requiredTools:
      - filesystem
    preferredCostClasses:
      - near_zero
      - low
