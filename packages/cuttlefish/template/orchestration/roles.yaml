# Role definitions: the capability/tool requirements and routing preferences the
# matrix scheduler uses to match workers (workers.yaml) into a coordinator team.
# Roles are intentionally provider-neutral — they never name a worker or engine.
#
# `kind:` declares what the role *is*, and drives real execution controls: a
# reviewer kind gets a generated read-only review bundle and a "do not modify
# files" prompt, and is never chosen as the implementation workspace. Valid
# values: implementer, reviewer, independent_reviewer, adversarial_reviewer,
# architect, qa.
#
# Declaring it is strongly recommended. A role that omits `kind:` falls back to
# inference from its id and capabilities, which is fragile in both directions:
# a role named `preview-generator` is classified as a reviewer because its id
# contains "review", and a role named `verifier` matches nothing at all. An
# explicitly empty `kind: []` means "none of these kinds".
roles:
  architect:
    kind:
      - architect
    requiredCapabilities:
      - architecture
    requiredTools:
      - filesystem
    preferredTiers:
      - frontier

  seniorImplementer:
    kind:
      - implementer
    requiredCapabilities:
      - repo_edit
      - coding
    requiredTools:
      - git
      - filesystem
    preferredTiers:
      - frontier

  # Cross-family review: must be a different family than the implementer so a
  # provider's blind spots are not reviewed by the same provider.
  independentReviewer:
    kind:
      - independent_reviewer
    requiredCapabilities:
      - code_review
    requiredTools:
      - filesystem
    familyConstraint: opposite_of_implementer
    preferredCostClasses:
      - low
      - medium

  # Adversarial pass for the riskiest changes. Distinct capability set from
  # independentReviewer so the scheduler resolves it to a different worker.
  adversarialReviewer:
    kind:
      - adversarial_reviewer
    requiredCapabilities:
      - adversarial_review
      - bug_hunt
    requiredTools:
      - filesystem
    preferredCostClasses:
      - low
      - medium

  qaGate:
    kind:
      - qa
    requiredCapabilities:
      - validation
    requiredTools:
      - shell
    preferredCostClasses:
      - near_zero
      - low

  # Triage is none of the controlled kinds: it neither implements nor reviews.
  # Declared empty so it can never drift into one by a future rename.
  localTriage:
    kind: []
    requiredCapabilities:
      - triage
    requiredTools:
      - filesystem
    preferredCostClasses:
      - near_zero
      - low
