name: Bump Homebrew Formula

on:
  workflow_run:
    workflows: ["Publish npm Package"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Published cuttlefish-cli version to place in the formula
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-version:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve published version
        id: resolve
        env:
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            TAG="${WORKFLOW_RUN_HEAD_BRANCH}"
            VERSION="${TAG#v}"
          else
            VERSION="${MANUAL_VERSION}"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected an exact numeric SemVer version, got: ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  bump-formula:
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Keep the write credential out of git configuration until the
          # final, explicit push step.
          persist-credentials: false

      - name: Wait for npm tarball
        run: |
          TARBALL_URL="https://registry.npmjs.org/cuttlefish-cli/-/cuttlefish-cli-${VERSION}.tgz"
          for i in {1..30}; do
            if curl --fail --silent --show-error --location --output /dev/null "${TARBALL_URL}"; then
              echo "Tarball available"
              exit 0
            fi
            echo "Waiting for npm publish... (attempt $i/30)"
            sleep 10
          done
          echo "Tarball not found after 5 minutes" >&2
          exit 1

      - name: Update formula
        run: |
          TARBALL_URL="https://registry.npmjs.org/cuttlefish-cli/-/cuttlefish-cli-${VERSION}.tgz"
          SHA="$(curl --fail --silent --show-error --location "${TARBALL_URL}" | shasum -a 256 | cut -d' ' -f1)"
          test -n "${SHA}"
          sed -i "s|cuttlefish-cli-.*\\.tgz|cuttlefish-cli-${VERSION}.tgz|" Formula/cuttlefish.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA}\"|" Formula/cuttlefish.rb

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cuttlefish.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "formula: bump to v${VERSION}"
          gh auth setup-git
          git push origin HEAD:main
