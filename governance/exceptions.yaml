schema_version: "3.3"
exceptions:
  - exception_id: "CUTTLEFISH-NO-CONTROL-LAYER-SURFACE"
    description: >-
      giles scan-repo classifies cuttlefish as control-layer-profile and
      requires a top-level `control/` surface. Cuttlefish is a pnpm workspace
      application (packages/, e2e/, schemas/, docs/) with no control-plane
      role in the fleet; Giles' own repo_config declares repo_type "service".
      There is no control-layer contract for this repo to host.
    owner: "human_operator"
    approved_by: "eric"
    mitigations:
      - "repo_type: service declared in governance/repo_config.yaml"
      - "Governance posture carried by governance/ and .giles/ artifacts"
    created_at: "2026-08-03T00:00:00Z"
    review_by: "2027-02-03T00:00:00Z"
    expires_at: "2027-08-03T00:00:00Z"
    status: "active"
    suppressed_codes:
      - "GILES-STRUCTURE-CONTROL"
      - "GILES-CTRL-PROFILE-MISSING-control"
    suppressed_finding_keys: []
    divergence_class: "permanent"
    justification: >-
      Creating an empty `control/` directory would assert a control-layer role
      cuttlefish does not have. The classification looks like a scan-repo
      heuristic over-match rather than a real deviation; recorded here so it
      stays reviewable rather than silently suppressed.
    linked_migration: null
    linked_investigation: null
    review_history: []
  - exception_id: "CUTTLEFISH-LEGACY-FEATURE-LEDGER-FORMAT"
    description: >-
      Cuttlefish retains historically authored feature-ledger records that
      predate the current Giles feature-action YAML schema. The current
      migration command would archive that tracked operator history and
      replace it with an empty baseline, which is not an acceptable
      preservation strategy for this repository.
    owner: "human_operator"
    approved_by: "eric"
    mitigations:
      - "Historical ledgers remain tracked and readable in their original Markdown format."
      - "New feature work is recorded in the current repository ledger until a preserving migration is available."
    created_at: "2026-08-12T00:00:00Z"
    review_by: "2026-09-12T00:00:00Z"
    expires_at: "2026-12-31T00:00:00Z"
    status: "active"
    suppressed_codes:
      - "GFL-004"
      - "GFL-007"
      - "GFL-008"
    suppressed_finding_keys: []
    divergence_class: "transitional"
    justification: >-
      The watcher correctly identifies that the historical files do not meet
      the modern schema, but the supplied `giles migrate-ledger --apply`
      operation is archive-and-rebaseline rather than a lossless conversion.
      This bounded exception preserves the records while requiring a review
      for a preserving migration path before expiry.
    linked_migration: null
    linked_investigation: null
    review_history: []
  - exception_id: "CUTTLEFISH-SERVICE-LAYOUT"
    description: >-
      Cuttlefish is a pnpm workspace service with intentional top-level
      package, asset, end-to-end, formula, scratchpad, and test-result lanes
      not enumerated by the generic service profile.
    owner: "human_operator"
    approved_by: "eric"
    mitigations:
      - "AGENTS.md and docs/INDEX.md describe the monorepo package and operator surface."
      - "Generated output and test-result paths remain excluded from runtime source claims."
    created_at: "2026-08-12T00:00:00Z"
    review_by: "2027-02-12T00:00:00Z"
    expires_at: "2027-08-12T00:00:00Z"
    status: "active"
    suppressed_codes:
      - "IDX-GD-002"
    suppressed_finding_keys: []
    divergence_class: "permanent"
    justification: >-
      Moving the workspace's published packages, e2e coverage, Homebrew
      Formula, or generated test-result lanes under generic service
      directories would misrepresent the actual TypeScript monorepo. The
      service profile is otherwise appropriate; this exception records the
      profile's narrower directory vocabulary for review.
    linked_migration: null
    linked_investigation: null
    review_history: []
